# Publishes the built frontend to GitHub Pages.
#
# This deploys the UI only. The Express API and PostgreSQL cannot run on Pages —
# until an API is hosted elsewhere, sign-in and every data request will fail.
# Point the build at a real API by setting a repository variable named
# VITE_API_BASE_URL (Settings -> Secrets and variables -> Actions -> Variables).
#
# Set Settings -> Pages -> Source to "GitHub Actions", not "Deploy from a branch".

name: Deploy frontend to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build the SPA
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: npm run build -w frontend

      # Pages has no server-side rewrite, so a direct hit on /screening would
      # 404. Serving the same document as the 404 page hands the URL to the
      # client router instead.
      - name: Add SPA fallback
        run: cp frontend/dist/index.html frontend/dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
