name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: adhd
          POSTGRES_PASSWORD: adhd
          POSTGRES_DB: adhd_care_hub_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://adhd:adhd@localhost:5432/adhd_care_hub_test?schema=public
      JWT_ACCESS_SECRET: test-secret-that-is-long-enough-for-ci-usage
      JWT_REFRESH_SECRET: another-test-secret-that-is-long-enough-ok
      PHI_ENCRYPTION_KEY: dGVzdC1rZXktMzItYnl0ZXMtbG9uZy1mb3ItY2ktdXNlIQ==
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema backend/prisma/schema.prisma
      - run: npx prisma migrate deploy --schema backend/prisma/schema.prisma
      - run: npm run build -w backend
      - run: npm run test -w backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build -w frontend

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm audit --audit-level=high
