services:
  postgres:
    image: postgres:16-alpine
    container_name: adhd-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: adhd
      POSTGRES_PASSWORD: adhd
      POSTGRES_DB: adhd_care_hub
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adhd -d adhd_care_hub"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
